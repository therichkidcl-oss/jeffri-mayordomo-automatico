<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🦇 Batcave</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="min-h-screen flex flex-col" style="background:#0a0a0a; color:#fafafa; font-family:'Courier New', Courier, monospace;">
  <header class="border-b p-4 flex justify-between items-center" style="border-color:#262626; background:linear-gradient(180deg, #0a0a0a 0%, #141414 100%);">
    <h1 class="text-2xl font-bold tracking-wider flex items-center gap-3" style="color:#fafafa;">
      <span style="color:#f97316; text-shadow:0 0 12px #f97316aa;">🦇</span>
      <span>Batcave</span>
      <span style="color:#737373; font-weight:normal; font-size:0.85em;">— Jeffri al servicio</span>
    </h1>
    <div class="flex gap-2 items-center">
      <button id="btn-projects" class="btn-toolbar">📁 Proyectos</button>
      <button id="btn-capture" class="btn-toolbar">📸 Captura</button>
      <button id="btn-stop" class="btn-toolbar btn-danger">⏹ Stop</button>
      <div id="status" class="text-sm ml-4" style="color:#a3a3a3;">Conectando...</div>
    </div>
  </header>

  <main class="flex-1 grid grid-cols-3 gap-4 p-4 max-w-7xl mx-auto w-full">
    <section class="col-span-2 panel flex items-center justify-center">
      <canvas id="batcave-canvas" width="1024" height="576" class="pixelated w-full"></canvas>
    </section>

    <aside class="panel flex flex-col">
      <div id="messages" class="flex-1 overflow-y-auto space-y-2 mb-2 min-h-[300px] pr-1"></div>
      <div id="attachments" class="flex flex-wrap gap-2 mb-2"></div>
      <form id="chat-form" class="flex gap-2 items-center">
        <button type="button" id="btn-attach" title="Adjuntar imagenes" class="btn-attach">📎</button>
        <input type="file" id="file-picker" accept="image/*" multiple style="display:none">
        <input id="chat-input" type="text" placeholder="Sus ordenes, senor..." class="chat-input">
        <button type="submit" class="btn-send">Enviar</button>
      </form>
    </aside>
  </main>

  <script type="module" src="/static/js/state.js"></script>
  <script type="module" src="/static/js/chat.js"></script>
  <script type="module" src="/static/js/scene_batcave.js"></script>
  <script type="module" src="/static/js/toolbar.js"></script>
</body>
</html>
